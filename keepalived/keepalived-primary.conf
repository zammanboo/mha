vrrp_script chk_proxysql {
  script "__BASE_DIR__/scripts/check_proxysql.sh"
  interval 2
  timeout 1
  fall 3
  rise 2
}

vrrp_instance mysql_proxy_vip {
  state MASTER
  interface eth0
  virtual_router_id 51
  priority 110
  advert_int 1

  authentication {
    auth_type PASS
    auth_pass CHANGE_ME
  }

  virtual_ipaddress {
    10.0.0.50/24
  }

  track_script {
    chk_proxysql
  }
}
